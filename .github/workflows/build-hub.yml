# Build used by the zJu4nn Hub "Mashups" tab.
# Compiles the Fabric mod (Gradle, JDK 21) from this fork's source and publishes the jar as a release.
# Upstream: https://github.com/ZapGaming/holocraft (MIT) — all credit to ZapGaming.
name: build-hub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. hub-v0.2.0-1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Fabric mod
        working-directory: mod
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache build

      - name: Package
        run: |
          ver=$(grep '^mod_version=' mod/gradle.properties | cut -d= -f2 | tr -d '\r')
          jar="mod/build/libs/holocraft-$ver.jar"
          test -f "$jar" || { echo "mod jar not found"; ls -la mod/build/libs; exit 1; }
          cp "$jar" "holocraft-$ver.jar"
          sha256sum "holocraft-$ver.jar"
          echo "JAR=holocraft-$ver.jar" >> "$GITHUB_ENV"
          echo "VER=$ver" >> "$GITHUB_ENV"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" "$JAR" --repo "${{ github.repository }}" --title "HoloCraft $VER (zJu4nn Hub)" --notes "Build of ZapGaming/holocraft $VER for the zJu4nn Hub Mashups tab. Source: this fork at ${{ github.sha }}. MIT."
